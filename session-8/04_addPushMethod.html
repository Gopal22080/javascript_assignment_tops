<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>


    <h2>Use the push() method to add a new playlist</h2>

    <script>

        let playlists = [
            {
                name: "Chill Vibes",
                creator: "Spotify",
                numberOfSongs: 25
            },
            {
                name: "Workout Mix",
                creator: "Rahul",
                numberOfSongs: 18
            },
            {
                name: "Road Trip",
                creator: "Anjali",
                numberOfSongs: 30
            }
        ];

        console.log("Original Playlists:");
        console.log(playlists);

        
        playlists.push({
            name: "Pop Songs",
            creator: "Gopal",
            numberOfSongs: 20
        });

        console.log("After Push:");
        console.log(playlists);

        playlists.pop();

        console.log("After Pop:");
        console.log(playlists);
    </script>

</body>
</html>
