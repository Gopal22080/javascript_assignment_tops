  <!DOCTYPE html>
<html>
<head>
    <title>Push Method Example</title>
</head>
<body>

    <h2> unique name, creator, and numberOfSongs.</h2>
    <script>
        const playlists = [
            {
                name: "Top Hits",
                creator: "Spotify",
                numberOfSongs: 50
            },
            {
                name: "Chill Vibes",
                creator: "Gopal",
                numberOfSongs: 30
            },
            {
                name: "Workout Mix",
                creator: "Rahul",
                numberOfSongs: 40
            }
        ];

        playlists.push({
            name: "Party Songs",
            creator: "Aman",
            numberOfSongs: 25
        });

        console.log(playlists);
    </script>
</body>
</html>
