<!DOCTYPE html>

<body>

  <h2>Save Recent Searches</h2>
  <script>
let searches = [];

function saveRecentSearch(query)
{
    searches.push(query);

    localStorage.setItem("recentSearches", JSON.stringify(searches));
}

saveRecentSearch("Pizza");
saveRecentSearch("Sneakers");

console.log(localStorage.getItem("recentSearches"));

</script>
</body>
</html>
