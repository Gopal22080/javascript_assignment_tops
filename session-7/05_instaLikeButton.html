<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!DOCTYPE html>
<html>
<head>
    <title>Like Button</title>
</head>
<body>
    <button id="likeBtn">7
         Like 0
    </button>
    <script>
        let count = 0;
        let button =
            document.getElementById("likeBtn");
        button.addEventListener("click", function () {
            count++;
            button.innerText =
                " Like " + count;
        });
    </script>
</body>
</html>
</body>
</html>
