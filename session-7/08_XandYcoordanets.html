<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
    <style>
        #box {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px auto;
            cursor: pointer;
            font-size: 20px;
        }

        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="box">
        Click Anywhere Inside This Box
    </div>

    <p id="result">Coordinates will appear here.</p>

    <script>
        const box = document.getElementById("box");
        const result = document.getElementById("result");

        box.addEventListener("click", function (event) {
            result.textContent = `X Coordinate: ${event.clientX}, Y Coordinate: ${event.clientY}`;
        });
    </script>  
</body>
</html>
