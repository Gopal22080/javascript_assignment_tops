<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
<input type="text" id="colorInput" placeholder="Enter color"oninput="changeColor()"/>

<div
  id="moodbox"
  style="width:200px;height:200px;border:1px solid black;">
</div>

<script>
  function changeColor() {
  let color = document.getElementById("colorInput").value;
  document.getElementById("moodbox").style.backgroundColor = color;
}
</script>

</body>
</html>
